name: Bug report
description: Something resolves, builds or compiles differently than documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the full error, including the dependency path it prints.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest set of services and registrations that shows the problem.
      render: rust
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hosting version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: rustc
    attributes:
      label: rustc version
      description: Output of `rustc --version`.
    validations:
      required: true
